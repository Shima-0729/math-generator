<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="条件を選んで算数の計算問題を作り、問題用紙と解答をPDFで保存できるツールです。">
  <meta name="color-scheme" content="light">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; connect-src 'self'; img-src 'self' data: blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title>算数プリント作成ツール</title>
  <link rel="stylesheet" href="css/style.css">
  <script defer src="vendor/jspdf.umd.min.js"></script>
  <script defer src="js/generator.js"></script>
  <script defer src="js/pdf.js"></script>
  <script defer src="js/app.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="site-header__inner">
      <p class="eyebrow">MATH WORKSHEET MAKER</p>
      <h1>算数プリント作成ツール</h1>
      <p class="lead">条件を選ぶだけで、計算問題と解答をまとめて作成できます。</p>
    </div>
  </header>

  <main class="app-shell">
    <section class="settings-card" aria-labelledby="settings-title">
      <div class="section-heading">
        <span class="step-number" aria-hidden="true">1</span>
        <div>
          <h2 id="settings-title">問題の条件</h2>
          <p>作りたいプリントの難しさを設定してください。</p>
        </div>
      </div>

      <form id="generator-form" novalidate>
        <fieldset class="form-group">
          <legend>問題タイプ</legend>
          <label class="choice-card">
            <input type="radio" name="problem-type" value="mixed" checked>
            <span>
              <strong>普通の計算＋逆算</strong>
              <small>答えまたは式の途中が□になります</small>
            </span>
          </label>
          <label class="choice-card">
            <input type="radio" name="problem-type" value="inverse">
            <span>
              <strong>逆算のみ</strong>
              <small>式の途中が必ず□になります</small>
            </span>
          </label>
        </fieldset>

        <div class="form-row">
          <label class="form-field" for="problem-count">
            <span>問題数</span>
            <select id="problem-count" name="problem-count">
              <option value="15" selected>15問</option>
              <option value="30">30問</option>
            </select>
          </label>

          <label class="form-field" for="term-count">
            <span>項数</span>
            <select id="term-count" name="term-count">
              <option value="2">2項</option>
              <option value="3" selected>3項</option>
              <option value="4">4項</option>
            </select>
          </label>
        </div>

        <label class="form-field" for="max-int">
          <span>数値上限</span>
          <input id="max-int" name="max-int" type="number" value="500" min="10" max="10000" step="1" inputmode="numeric" required aria-describedby="max-int-help">
          <small id="max-int-help">10～10000の整数を入力してください。</small>
        </label>

        <label class="form-field" for="seed">
          <span>seed <em>任意</em></span>
          <input id="seed" name="seed" type="text" maxlength="80" autocomplete="off" placeholder="例：20260818" aria-describedby="seed-help">
          <small id="seed-help">空欄なら毎回新しい問題、入力すると同じ問題を再現できます。</small>
        </label>

        <div id="form-error" class="error-message" role="alert" aria-live="assertive" hidden></div>

        <button class="primary-button" type="submit">
          <span>問題を生成</span>
        </button>
      </form>

      <dl class="generation-status" aria-live="polite">
        <div>
          <dt>使用したseed</dt>
          <dd><output id="used-seed">未生成</output></dd>
        </div>
      </dl>
    </section>

    <section class="preview-section" aria-labelledby="preview-title">
      <div class="preview-toolbar">
        <div class="section-heading">
          <span class="step-number" aria-hidden="true">2</span>
          <div>
            <h2 id="preview-title">プレビュー</h2>
            <p>生成した問題と解答を一覧で確認できます。</p>
          </div>
        </div>
        <button id="download-button" class="secondary-button" type="button" disabled>
          PDFをダウンロード
        </button>
      </div>

      <div id="preview-empty" class="preview-empty">
        <p class="preview-empty__symbol" aria-hidden="true">□</p>
        <p>条件を設定して「問題を生成」を押すと、ここにプリントが表示されます。</p>
      </div>

      <div id="problem-preview" class="problem-preview" hidden>
        <table class="problem-preview__table">
          <thead>
            <tr>
              <th scope="col">問題</th>
              <th scope="col">解答</th>
            </tr>
          </thead>
          <tbody id="problem-preview-body" aria-live="polite"></tbody>
        </table>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>問題生成とPDF作成は、すべてこのブラウザ内で行われます。</p>
  </footer>

  <noscript>
    <p class="noscript-message">このツールを使うにはJavaScriptを有効にしてください。</p>
  </noscript>
</body>
</html>
